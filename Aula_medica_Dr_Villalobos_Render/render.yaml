services:
  - type: web
    name: aula-medica-dr-villalobos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AULA_ADMIN_PASSWORD
        generateValue: true
      - key: AULA_DATA_DIR
        value: /var/data
    disk:
      name: aula-medica-data
      mountPath: /var/data
      sizeGB: 1
