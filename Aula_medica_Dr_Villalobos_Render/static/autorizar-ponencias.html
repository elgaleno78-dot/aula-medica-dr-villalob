<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVICO® | Autorizar ponencias</title><style>body{font-family:Arial,sans-serif;background:#f3f7fb;color:#12304e;margin:0}main{max-width:760px;margin:40px auto;padding:24px}h1{color:#073b76}.panel{background:white;border:1px solid #dce7f0;border-radius:14px;padding:22px;margin:16px 0}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #abc;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;background:#073b76;color:white;cursor:pointer;margin:6px 5px 0 0}.reject{background:#9d2d36}.item{border-bottom:1px solid #dde5ef;padding:16px 0}.muted{color:#627587;font-size:14px}</style></head><body><main><h1>AVICO® Educación</h1><p>Autorización de nuevas ponencias de Google Drive. Ningún video pendiente se muestra a los alumnos hasta que lo apruebes.</p><section class="panel"><label for="token">Token de administrador (sesión del aula)</label><input id="token" type="password" autocomplete="off" placeholder="Pega el token de administrador"><button id="refresh">Consultar pendientes</button><p class="muted">El token solo se utiliza durante esta página; no se guarda.</p></section><section class="panel"><h2>Ponencias pendientes</h2><div id="results">Inicia la consulta para revisar videos.</div></section></main><script>
const token=document.getElementById('token'),results=document.getElementById('results');
function headers(){return {'Authorization':'Bearer '+token.value.trim()}}
async function load(){
results.textContent='Consultando...';
try{const r=await fetch('/api/admin/education-drive/pending',{headers:headers(),cache:'no-store'});if(!r.ok)throw Error('No se pudo consultar ('+r.status+'). Comprueba tu sesión de administrador.');const rows=await r.json();results.replaceChildren();if(!rows.length){results.textContent='No hay ponencias pendientes.';return;}
for(const item of rows){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=item.title;div.append(name);const meta=document.createElement('p');meta.className='muted';meta.textContent='Detectada: '+item.detected_at;div.append(meta);
for(const [label,decision,css] of [['Autorizar','approve',''],['Rechazar','reject','reject']]){const b=document.createElement('button');b.textContent=label;b.className=css;b.onclick=async()=>{if(!confirm((decision==='approve'?'¿Publicar':'¿Rechazar')+' la ponencia «'+item.title+'»?'))return;b.disabled=true;try{const r=await fetch('/api/admin/education-drive/'+encodeURIComponent(item.file_id)+'/decision',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({decision})});if(!r.ok)throw Error('Error '+r.status);await load()}catch(e){alert(e.message);b.disabled=false}};div.append(b)}results.append(div)}
}catch(e){results.textContent=e.message}}
document.getElementById('refresh').onclick=load;
</script></body></html>
